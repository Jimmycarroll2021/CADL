name: Slack Agent Issue Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/slack-agent-issues/*.json"

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create issues from queued requests
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const changed = new Set();
            for (const commit of context.payload.commits || []) {
              for (const file of [...(commit.added || []), ...(commit.modified || [])]) {
                if (file.startsWith(".github/slack-agent-issues/") && file.endsWith(".json")) {
                  changed.add(file);
                }
              }
            }

            for (const file of changed) {
              const fullPath = path.join(process.cwd(), file);
              if (!fs.existsSync(fullPath)) {
                continue;
              }

              const request = JSON.parse(fs.readFileSync(fullPath, "utf8"));
              const marker = `Slack-Agent-Task: ${request.task_id}`;
              const existing = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue "${marker}"`,
              });
              if (existing.data.total_count > 0) {
                core.info(`Issue already exists for ${request.task_id}`);
                continue;
              }

              const body = `${request.body || ""}\n\n---\n${marker}\nQueued from ${file}`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: request.title || `Slack agent task ${request.task_id}`,
                body,
                labels: request.labels || ["ai-agent", "backlog"],
              });
              core.info(`Created issue for ${request.task_id}`);
            }
